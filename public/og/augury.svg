<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#FFFAF0" stop-opacity="0.94"/>
    </linearGradient>
    <pattern id="ruled" x="0" y="0" width="1200" height="28" patternUnits="userSpaceOnUse">
      <line x1="0" y1="27" x2="1200" y2="27" stroke="#63A3DC" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0%" stop-color="#F4C430" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#F4C430" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Paper-ruled base: warm cream + horizontal blue rules + red legal-pad margin -->
  <rect width="1200" height="630" fill="#FEFDFB"/>
  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#ruled)"/>
  <rect x="90" y="0" width="2" height="630" fill="#FF6363" fill-opacity="0.12"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Top accent rule -->
  <rect x="60" y="60" width="80" height="3" fill="#C99517"/>

  <!-- Eyebrow -->
  <text x="60" y="100" font-family="Verdana, Geneva, sans-serif" font-size="20" font-weight="700" fill="#2A5570" letter-spacing="3">SUNDOG · AUGURY</text>

  <!-- Headline -->
  <text x="60" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#1A3A52">Do the gamblers</text>
  <text x="60" y="259" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" fill="#1A3A52">beat the bureau?</text>

  <!-- Lede -->
  <text x="60" y="366" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="400" fill="#40505C">Weather prediction markets, scored</text>
  <text x="60" y="398" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="400" fill="#40505C">against the model stack at matched</text>
  <text x="60" y="430" font-family="Verdana, Geneva, sans-serif" font-size="22" font-weight="400" fill="#40505C">cutoffs. The edge is in the final hours.</text>

  <!-- URL -->
  <text x="60" y="560" font-family="Courier New, Courier, monospace" font-size="22" font-weight="700" fill="#1A3A52">sundog.cc/augury</text>

  <!-- Per-page visualization (right side, ~620 to ~1140) -->
  <g filter="url(#cardShadow)">
    <rect x="660" y="125" width="490" height="395" rx="6" fill="#F5EFE0" stroke="#8C6F3A" stroke-width="2" transform="rotate(-0.6 905 322)"/>
  </g>
  <text x="905" y="160" font-family="Verdana, Geneva, sans-serif" font-size="10" font-weight="800" letter-spacing="2" fill="#684811" text-anchor="middle">MARKET vs MODELS &#183; MATCHED CUTOFFS</text>
  <line x1="700" y1="176" x2="1110" y2="176" stroke="#8C6F3A" stroke-width="1" stroke-dasharray="3 5" opacity="0.6"/>
  <line x1="715" y1="350" x2="1085" y2="350" stroke="#5A6772" stroke-width="1.2"/>
  <line x1="715" y1="200" x2="715" y2="350" stroke="#5A6772" stroke-width="1.2"/>
  <line x1="715" y1="350" x2="1085" y2="350" stroke="#9AA4AC" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="1082" y="366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#8a949c" text-anchor="end">models even with the market</text>
  <text x="711" y="196" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#5A6772" text-anchor="end">market edge</text>
  <path d="M715,319 L752,309 L789,315 L826,309 L863,322 L900,309 L937,297 L974,278 L1011,275 L1048,243 L1085,215 L1085,350 L715,350 Z" fill="#2E7D5A" fill-opacity="0.12"/>
  <polyline points="715,319 752,309 789,315 826,309 863,322 900,309 937,297 974,278 1011,275 1048,243 1085,215" fill="none" stroke="#2E7D5A" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="1085" cy="215" r="6" fill="#2E7D5A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="715" cy="319" r="4" fill="#2E7D5A" fill-opacity="0.5"/>
  <text x="715" y="366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" fill="#8a949c" text-anchor="start">&#8722;12h</text>
  <text x="900" y="378" font-family="Verdana, Geneva, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5" fill="#5A6772" text-anchor="middle">HOURS BEFORE THE DAILY HIGH</text>
  <text x="1085" y="205" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="800" fill="#2E7D5A" text-anchor="end">4&#215; larger</text>
  <line x1="700" y1="398" x2="1110" y2="398" stroke="#CFD8DC" stroke-width="1"/>
  <text x="905" y="420" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="italic" fill="#1A3A52" text-anchor="middle">The augur beats the bureau at the margin &#8212;</text>
  <text x="905" y="442" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="italic" fill="#1A3A52" text-anchor="middle">but only where the bureau has stopped looking.</text>
  <g transform="translate(700,460)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="410" height="20" rx="10" fill="#FFFFFF" stroke="#1A3A52" stroke-width="1.4"/>
    <text x="205" y="14" font-family="Verdana, Geneva, sans-serif" font-size="9" font-weight="800" letter-spacing="1" fill="#1A3A52" text-anchor="middle">NON-REDUNDANT SET: NBM &#183; ECMWF &#183; MARKET (GEFS SCREENED)</text>
  </g>
  <text x="905" y="505" font-family="Verdana, Geneva, sans-serif" font-size="9" font-weight="800" letter-spacing="1.4" fill="#5A2A22" text-anchor="middle">INFORMATION CLAIM ONLY &#183; NOT INVESTMENT ADVICE</text>

  <!-- Bottom-right mark -->
  <text x="1140" y="600" font-family="Verdana, Geneva, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#9AA4AC" text-anchor="end">sundog.cc</text>
</svg>
